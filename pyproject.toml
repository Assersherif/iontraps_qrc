[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iontraps-qrc"
version = "0.1.0"
description = "Trapped-ion quantum reservoir computing for network intrusion / zero-day detection (NF-UNSW-NB15)"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "scipy", "matplotlib"]

[project.optional-dependencies]
notebooks = ["jupyter", "nbformat", "ipykernel"]
hardware = ["pytket", "pytket-quantinuum", "qnexus"]   # only for backend nexus/syntax
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
